<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080b0f">
  <title>Portfolio · Cryptolive</title>
  <meta name="description" content="Track your cryptocurrency portfolio">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-boot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js" defer></script>
  <script type="module" src="/js/pages/portfolio.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="shell" id="main">
    <div class="hero">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div>
          <h1 data-i18n="portfolio.title">My Portfolio</h1>
          <p class="hero-sub" data-i18n="portfolio.sub">Track your cryptocurrency holdings</p>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <button class="btn btn-ghost btn-sm" id="exportBtn" data-i18n="common.export">Export</button>
          <label class="btn btn-ghost btn-sm" style="margin:0; cursor:pointer;" data-i18n="common.import">
            Import
            <input type="file" id="importInput" accept=".json" style="display:none">
          </label>
          <button class="btn btn-danger btn-sm" id="clearBtn" data-i18n="common.clear2">Clear</button>
          <button class="btn btn-primary" id="addTxBtn" data-i18n="portfolio.addTx">Add transaction</button>
        </div>
      </div>
    </div>
    
    <div class="summary-strip" id="portfolioSummary">
      <!-- KPI cards -->
    </div>

    <div class="grid-2" style="grid-template-columns: 2fr 1fr; margin-bottom:24px;">
      <div class="card">
        <div class="card-head" data-i18n="portfolio.holdings">Holdings</div>
        <div id="holdingsTable"></div>
      </div>
      <div class="card">
        <div class="card-head" data-i18n="portfolio.allocation">Allocation</div>
        <div class="card-body" style="display:flex; justify-content:center; align-items:center; min-height: 300px;">
          <canvas id="allocChart"></canvas>
        </div>
      </div>
    </div>

    <div class="card" id="txTableCard" style="margin-bottom: 24px;">
      <div class="card-head" id="txTableHead" data-i18n="portfolio.transactions">
        Transactions
        <span id="txFilterSpan" style="font-weight:normal; font-size:0.85rem; color:var(--muted)"></span>
      </div>
      <div id="txTable"></div>
    </div>
  </main>
  <div id="app-footer"></div>
</body>
</html>
