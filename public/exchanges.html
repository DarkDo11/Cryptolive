<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080b0f">
  <title>Top Cryptocurrency Exchanges · Cryptolive</title>
  <meta name="description" content="Top cryptocurrency spot exchanges">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-boot.js"></script>
  <script type="module" src="/js/pages/exchanges.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="shell" id="main">
    <div class="hero" style="margin-bottom: 24px;">
      <h1 data-i18n="exchanges.title">Top Cryptocurrency Exchanges</h1>
    </div>
    
    <div class="toolbar" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
      <input type="search" class="input" id="exSearch" placeholder="Search exchanges" data-i18n-placeholder="exchanges.searchPlaceholder" style="width:260px" autocomplete="off">
      <select class="select" id="exSort" style="width:auto">
        <option value="trust" data-i18n="exchanges.sortTrust">Trust rank</option>
        <option value="volume" data-i18n="exchanges.sortVolume">24h volume</option>
        <option value="year" data-i18n="exchanges.sortYear">Oldest first</option>
        <option value="name" data-i18n="exchanges.sortName">Name A–Z</option>
      </select>
      <select class="select" id="exType" style="width:auto">
        <option value="all" data-i18n="exchanges.typeAll">All exchanges</option>
        <option value="cex" data-i18n="exchange.cex">Centralized</option>
        <option value="dex" data-i18n="exchange.dex">Decentralized</option>
      </select>
      <span class="muted small" id="exCount"></span>
    </div>
    <div id="exTable"></div>
    <div id="exPagination" style="margin-top: 24px; display: flex; justify-content: center;"></div>
  </main>
  <div id="app-footer"></div>
</body>
</html>
