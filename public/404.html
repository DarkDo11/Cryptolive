<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080b0f">
  <title>Page not found · Cryptolive</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-boot.js"></script>
  <script type="module" src="/js/pages/not-found.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="shell" id="main" style="padding-top: 64px;">
    <section class="card">
      <div class="card-body empty-state">
        <h1 data-i18n="notFound.title">404 — Page not found</h1>
        <p data-i18n="notFound.text">The page you are looking for does not exist.</p>
        <a class="btn btn-primary" href="/" style="margin-top: 16px;" data-i18n="notFound.back">Back to markets</a>
      </div>
    </section>
    <section class="card" style="margin-top:16px">
      <div class="card-body">
        <p class="muted" data-i18n="notFound.searchHint">Try searching for a coin, category or exchange:</p>
        <form id="nfSearchForm" class="try-form" style="margin-top:8px">
          <input class="input" id="nfSearch" type="search" data-i18n-placeholder="notFound.searchPlaceholder" placeholder="Search…" autocomplete="off">
          <button class="btn btn-primary" type="submit">→</button>
        </form>
        <div id="nfResults" class="highlight-list" style="margin-top:12px"></div>
      </div>
    </section>
    <section class="card" style="margin-top:16px">
      <div class="card-head" data-i18n="notFound.popular">Popular right now</div>
      <div id="nfTrending" class="highlight-list"></div>
    </section>
    <nav class="nf-links" style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap">
      <a class="btn btn-ghost btn-sm" href="/" data-i18n="nav.markets">Markets</a>
      <a class="btn btn-ghost btn-sm" href="/trending" data-i18n="nav.trending">Trending</a>
      <a class="btn btn-ghost btn-sm" href="/heatmap" data-i18n="nav.heatmap">Heatmap</a>
      <a class="btn btn-ghost btn-sm" href="/exchanges" data-i18n="nav.exchanges">Exchanges</a>
      <a class="btn btn-ghost btn-sm" href="/portfolio" data-i18n="nav.portfolio">Portfolio</a>
    </nav>
  </main>
  <div id="app-footer"></div>
</body>
</html>
