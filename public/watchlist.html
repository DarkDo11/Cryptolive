<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080b0f">
  <title>Watchlist · Cryptolive</title>
  <meta name="description" content="Track your favorite cryptocurrencies">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-boot.js"></script>
  <script type="module" src="/js/pages/watchlist.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="shell" id="main">
    <div class="hero" style="margin-bottom: 24px;">
      <h1 data-i18n="watchlist.title">My Watchlist</h1>
      <p class="hero-sub" id="watchSub"></p>
    </div>
    
    <div class="summary-strip" id="watchSummary" style="display: none; margin-bottom: 24px;"></div>
    
    <div class="toolbar" id="watchToolbar" style="display: none; gap: 8px; margin-bottom: 16px;">
      <button class="btn btn-ghost btn-sm" id="exportBtn" data-i18n="common.export">Export</button>
      <button class="btn btn-ghost btn-sm" id="exportCsvBtn" data-i18n="common.exportCsv">Export CSV</button>
      <label class="btn btn-ghost btn-sm" style="cursor: pointer;" data-i18n="common.import">
        Import
        <input type="file" id="importInput" accept=".json" style="display: none;">
      </label>
      <button class="btn btn-ghost btn-sm" id="shareBtn" data-i18n="watchlist.share">Share link</button>
      <button class="btn btn-ghost btn-sm" id="clearBtn" data-i18n="common.clear2">Clear</button>
    </div>

    <div class="notice" id="shareNotice" hidden>
      <span id="shareNoticeText"></span>
      <span style="display:inline-flex; gap:8px; margin-left:12px;">
        <button class="btn btn-primary btn-sm" id="shareAddBtn" data-i18n="watchlist.shareAdd">Add to my watchlist</button>
        <button class="btn btn-ghost btn-sm" id="shareDismissBtn" data-i18n="common.dismiss">Dismiss</button>
      </span>
    </div>
    
    <div id="watchTable"></div>
  </main>
  <div id="app-footer"></div>
</body>
</html>
